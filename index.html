<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTARA Medical | Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    color: #fff;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 3vw, 2rem);
    font-family: "Nunito", "Nunito Sans", system-ui, sans-serif;
    text-align: center;
  }
  h1, h2 {
    margin: 0;
    padding: 0 16px 0 calc(16px + 0.35em); /* offset trailing letter-spacing */
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }
  h1 { font-size: clamp(2rem, 8vw, 5.5rem); }
  h2 { font-size: clamp(1.5rem, 6vw, 4rem); }
  .contact {
    position: absolute;
    bottom: 2rem;
    left: 0;
    right: 0;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    padding: 0 16px;
  }
  .contact a {
    color: #fff;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .contact a:hover { opacity: 0.7; }
</style>
</head>
<body>
  <h1>ANTARA Medical</h1>
  <h2>Coming Soon</h2>
  <p class="contact">Contact us: <a href="mailto:info@antaramedical.com">info@antaramedical.com</a></p>
