    text-transform: uppercase;
    white-space: nowrap;
  }
  h2 {
    margin: 0;
    padding: 0 16px 0 calc(16px + 0.35em);
    font-weight: 400;
    font-size: clamp(1.25rem, 5vw, 3.5rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }
  .contact {
    position: absolute;
    bottom: 2rem;
    left: 0;
    right: 0;
    margin: 0;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    padding: 0 16px;
  }
  .contact a {
    color: #fff;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .contact a:hover { opacity: 0.7; }
